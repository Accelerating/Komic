name: Release APK

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v0.1.1)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
          log-accepted-android-sdk-licenses: false

      - name: Restore release signing files
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIGNING_PROPERTIES_BASE64: ${{ secrets.ANDROID_SIGNING_PROPERTIES_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$SIGNING_PROPERTIES_BASE64" ]]; then
            echo '::error::Configure ANDROID_KEYSTORE_BASE64 and ANDROID_SIGNING_PROPERTIES_BASE64 repository secrets before releasing.'
            exit 1
          fi
          umask 077
          mkdir -p .release-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .release-signing/komic-release.p12
          printf '%s' "$SIGNING_PROPERTIES_BASE64" | base64 --decode > .release-signing/signing.properties

      - name: Build release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Remove release signing files
        if: always()
        run: rm -f .release-signing/komic-release.p12 .release-signing/signing.properties

      - name: Verify and prepare APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          mkdir -p "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/Komic.apk"
          cd "$RUNNER_TEMP/release"
          sha256sum Komic.apk > SHA256SUMS.txt

      - name: Publish GitHub Release
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view -- "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload --clobber -- "$RELEASE_TAG" Komic.apk SHA256SUMS.txt
          else
            gh release create --verify-tag --title "$RELEASE_TAG" --generate-notes -- \
              "$RELEASE_TAG" Komic.apk SHA256SUMS.txt
          fi
